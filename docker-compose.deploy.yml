# 后端部署编排（app + postgres + redis）。
# 前端是独立项目/独立仓库，有自己的 compose，通过 nginx 反代到本服务的 3000 端口。
#
# 服务器上：每个环境一个目录（如 /opt/admin-backend-test、/opt/admin-backend-staging），
# 放本文件 + 一个 .env（真实密码/JWT 密钥，不进仓库）。镜像 tag 由 CI 部署时注入 IMAGE。

services:
  app:
    image: ${IMAGE:-backend:latest}
    container_name: admin-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-test}
      - APP_PORT=3000
      - APP_PREFIX=api
      - RUN_MIGRATIONS=true # entrypoint 启动前自动 migration:run
      # 数据库（容器内网主机名是 postgres）
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT（服务器 .env 配强随机值）
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # CORS 白名单（预发/生产设前端域名，逗号分隔；不设则测试环境放开）
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - app_uploads:/app/uploads
    ports:
      # 只绑宿主机回环，供同机前端 nginx 反代；跨机部署改成内网 IP 或加防火墙白名单
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: admin-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 一般不对外暴露；要本机连库调试就解开下面两行
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: admin-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # $$ 转义 = 容器内 shell 运行时取值：设了密码就 requirepass
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  app_uploads:
