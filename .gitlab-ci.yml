# ============================================================================
# 后端独立流水线（本仓库 = 后端项目根）
#
#   MR / develop / main → check   ：tsc + eslint + 单测 + 构建
#   develop 合入        → package ：打镜像推 GitLab Registry → 自动部署【测试】
#   main 合入           → deploy:staging：手动确认 → 部署【预发】
#
# 前置准备（Runner/Registry/服务器/.env/变量）见 docs/ci-cd.md
# ============================================================================

stages:
  - check
  - package
  - deploy

workflow:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'develop'"
    - if: "$CI_COMMIT_BRANCH == 'main'"
    - if: "$CI_COMMIT_BRANCH == 'master'"

variables:
  GIT_DEPTH: "5"

default:
  interruptible: true

# ────────────────────────── 检查 ──────────────────────────
check:
  stage: check
  image: node:20
  before_script:
    - corepack enable
  cache:
    key: backend-pnpm
    paths:
      - .pnpm-store
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit -p tsconfig.json
    - pnpm exec eslint "{src,test}/**/*.ts"
    - pnpm test
    - pnpm build

# ────────────────────────── 打镜像 ──────────────────────────
package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"
    - if: "$CI_COMMIT_BRANCH == 'main'"
    - if: "$CI_COMMIT_BRANCH == 'master'"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# ────────────────────────── 部署 ──────────────────────────
# 不写 needs，按 stage 顺序：check 不过 → 不打镜像 → 不部署
.deploy_tpl:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client curl
    - eval "$(ssh-agent -s)"
    - echo "$SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_DIR"
    - scp docker-compose.deploy.yml $SSH_USER@$SSH_HOST:$DEPLOY_DIR/
    # 拉镜像 + 重启；数据库迁移由 app 容器 entrypoint 自动执行
    - |
      ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && \
        IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        docker compose -f docker-compose.deploy.yml pull app && \
        IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        docker compose -f docker-compose.deploy.yml up -d --remove-orphans"
    # 健康检查（最多 ~60s），失败打出 app 日志
    - |
      ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && [ -f .env ] && . ./.env; \
        for i in \$(seq 1 30); do \
          if curl -sf http://127.0.0.1:\${APP_PORT:-3000}/health >/dev/null 2>&1; then echo '✅ healthy'; exit 0; fi; \
          sleep 2; \
        done; \
        echo '❌ health check failed'; docker logs --tail 50 admin-app; exit 1"

deploy:test:
  extends: .deploy_tpl
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"
  variables:
    SSH_HOST: $TEST_SSH_HOST
    SSH_USER: $TEST_SSH_USER
    SSH_KEY: $TEST_SSH_KEY
    DEPLOY_DIR: $TEST_DEPLOY_DIR

deploy:staging:
  extends: .deploy_tpl
  rules:
    - if: "$CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'master'"
      when: manual # 预发要人工确认（发布卡点）
  variables:
    SSH_HOST: $STAGING_SSH_HOST
    SSH_USER: $STAGING_SSH_USER
    SSH_KEY: $STAGING_SSH_KEY
    DEPLOY_DIR: $STAGING_DEPLOY_DIR
